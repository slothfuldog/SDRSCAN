[package]
name = "sdrscan-sast"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
rayon = "1.12.0"
serde_json = "1.0.154"
streaming-iterator = "0.1.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tree-sitter = "0.27.1"
tree-sitter-php = "0.25.1"
sdrscan-core = { version = "0.1.0", path = "../core" }
sdrscan-vulndb = { version = "0.1.0", path = "../vulndb" }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json"] }
jsonschema = "0.60.2"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
