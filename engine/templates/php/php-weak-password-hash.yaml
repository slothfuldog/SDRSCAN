id: php-weak-password-hash
type: sast
languages: [php]
severity: medium
cwe: [CWE-328, CWE-916]
tags: [php, crypto, secrets, owasp-a02]
message: "Password di-hash dengan md5/sha1; gunakan password_hash()."
query: |
  ((function_call_expression
     function: (name) @fn
     arguments: (arguments . (argument (_) @arg))) @finding
   (#match? @fn "(?i)^(md5|sha1)$")
   (#match? @arg "(?i)pass|pwd"))
