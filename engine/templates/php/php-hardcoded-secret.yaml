id: php-hardcoded-secret
type: sast
languages: [php]
severity: high
cwe: [CWE-798]
tags: [php, secrets, owasp-a07]
message: "Secret atau kredensial tertanam di kode; pindahkan ke konfigurasi atau secret manager."
query: |
  ((assignment_expression
     left: (variable_name) @name
     right: [(string) (encapsed_string)] @val) @finding
   (#match? @name "(?i)(password|passwd|pwd|secret|api_?key|token|private_?key)")
   (#match? @val "^.{6,}$"))
  ((function_call_expression
     function: (name) @fn
     arguments: (arguments
       . (argument (string) @name)
       . (argument [(string) (encapsed_string)] @val))) @finding
   (#match? @fn "(?i)^define$")
   (#match? @name "(?i)(password|passwd|pwd|secret|api_?key|token|private_?key)")
   (#match? @val "^.{6,}$"))
  ((array_element_initializer
     . (string) @name
     . [(string) (encapsed_string)] @val) @finding
   (#match? @name "(?i)(password|passwd|pwd|secret|api_?key|token|private_?key)")
   (#match? @val "^.{6,}$"))
